[package]
name = "viewer"
version = "0.1.0"
description = "CullisEngine desktop asset viewer"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fable-data = { path = "../../crates/fable-data" }
engine-core = { path = "../../crates/engine-core" }
engine-world = { path = "../../crates/engine-world" }
engine-render = { path = "../../crates/engine-render" }
game = { path = "../game" }
hecs = { version = "0.10", default-features = false }
log = "0.4.34"
env_logger = { version = "0.11.3", default-features = false, features = ["auto-color"] }
engine-audio = { path = "../../crates/engine-audio" }
engine-script = { path = "../../crates/engine-script" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
