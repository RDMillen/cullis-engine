[package]
name = "engine-render"
version = "0.1.0"
description = "CullisEngine rendering: GPU resources and passes drawing the world (wgpu)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
engine-world = { path = "../engine-world" }
fable-data = { path = "../fable-data" }
# The same wgpu as the windowing in the apps, whose device and queue it uses.
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
hecs = { version = "0.10", default-features = false }
log = "0.4.34"
